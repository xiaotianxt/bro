name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        id: release
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/bro" "dist/bro"
          cp README.md LICENSE NOTICE dist/
          tar -C dist -czf "bro-${{ steps.release.outputs.tag }}-${{ matrix.target }}.tar.gz" bro README.md LICENSE NOTICE
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bro-${{ steps.release.outputs.tag }}-${{ matrix.target }}
          path: bro-${{ steps.release.outputs.tag }}-${{ matrix.target }}.tar.gz

  extension:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        id: release
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.1.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build shared protocol
        run: pnpm --filter @bro/shared build
      - name: Build extension
        run: pnpm --filter @bro/extension build
      - name: Package extension
        run: |
          set -euo pipefail
          cd extension/dist
          zip -r ../../bro-extension-${{ steps.release.outputs.tag }}.zip .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bro-extension-${{ steps.release.outputs.tag }}
          path: bro-extension-${{ steps.release.outputs.tag }}.zip

  github-release:
    name: GitHub Release
    needs: [build, extension]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          generate_release_notes: true
