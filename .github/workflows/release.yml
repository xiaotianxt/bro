name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            package: tar
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            package: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package: tar
          - os: macos-15
            target: aarch64-apple-darwin
            package: tar
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            package: zip
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            package: zip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        id: release
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Build
        run: cargo +stable build --locked --release --target ${{ matrix.target }}
      - name: Package Unix
        if: matrix.package == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          archive="bro-${{ steps.release.outputs.tag }}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/bro" "dist/bro"
          cp README.md LICENSE NOTICE dist/
          tar -C dist -czf "$archive" bro README.md LICENSE NOTICE
      - name: Package Windows
        if: matrix.package == 'zip'
        shell: pwsh
        run: |
          $Archive = "bro-${{ steps.release.outputs.tag }}-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/bro.exe" "dist/bro.exe"
          Copy-Item README.md, LICENSE, NOTICE dist/
          Compress-Archive -Path dist/* -DestinationPath $Archive -Force
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bro-${{ steps.release.outputs.tag }}-${{ matrix.target }}
          path: bro-${{ steps.release.outputs.tag }}-${{ matrix.target }}.*

  extension:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        id: release
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check versions
        run: pnpm version:check
      - name: Build shared protocol
        run: pnpm --filter @bro/shared build
      - name: Build extension
        run: pnpm --filter @bro/extension build
      - name: Typecheck Pi extension
        run: pnpm --filter @xiaotianxt/pi-bro typecheck
      - name: Test Pi extension
        run: pnpm --filter @xiaotianxt/pi-bro test
      - name: Package extension
        run: |
          set -euo pipefail
          cd extension/dist
          zip -r ../../bro-extension-${{ steps.release.outputs.tag }}.zip .
      - name: Package Pi extension
        run: |
          set -euo pipefail
          mkdir -p pi-extension-dist
          pnpm --filter @xiaotianxt/pi-bro pack --pack-destination "$GITHUB_WORKSPACE/pi-extension-dist"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bro-extension-${{ steps.release.outputs.tag }}
          path: bro-extension-${{ steps.release.outputs.tag }}.zip
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bro-pi-extension-${{ steps.release.outputs.tag }}
          path: pi-extension-dist/*.tgz

  github-release:
    name: GitHub Release
    needs: [build, extension]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.tgz
          generate_release_notes: true
