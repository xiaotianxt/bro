name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
          - target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
          - target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
          - target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
          - target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
          - target: aarch64-pc-windows-msvc
            goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        id: release
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          exe=bro
          [[ "$GOOS" == windows ]] && exe=bro.exe
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/$exe" ./cmd/bro
          cp README.md LICENSE NOTICE dist/
          base="bro-${{ steps.release.outputs.tag }}-${{ matrix.target }}"
          if [[ "$GOOS" == windows ]]; then
            (cd dist && zip -q "../$base.zip" "$exe" README.md LICENSE NOTICE)
          else
            tar -C dist -czf "$base.tar.gz" "$exe" README.md LICENSE NOTICE
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bro-${{ steps.release.outputs.tag }}-${{ matrix.target }}
          path: bro-${{ steps.release.outputs.tag }}-${{ matrix.target }}.*

  extension:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        id: release
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check versions
        run: pnpm version:check
      - name: Build shared protocol
        run: pnpm --filter @bro/shared build
      - name: Build extension
        run: pnpm --filter @bro/extension build
      - name: Typecheck Pi extension
        run: pnpm --filter @xiaotianxt/pi-bro typecheck
      - name: Test Pi extension
        run: pnpm --filter @xiaotianxt/pi-bro test
      - name: Package extension
        run: |
          set -euo pipefail
          cd extension/dist
          zip -r ../../bro-extension-${{ steps.release.outputs.tag }}.zip .
      - name: Package Pi extension
        run: |
          set -euo pipefail
          mkdir -p pi-extension-dist
          pnpm --filter @xiaotianxt/pi-bro pack --pack-destination "$GITHUB_WORKSPACE/pi-extension-dist"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bro-extension-${{ steps.release.outputs.tag }}
          path: bro-extension-${{ steps.release.outputs.tag }}.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bro-pi-extension-${{ steps.release.outputs.tag }}
          path: pi-extension-dist/*.tgz

  github-release:
    name: GitHub Release
    needs: [build, extension]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.tgz
          generate_release_notes: true
