name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    needs: extension
    # macOS binaries are signed with codesign, which needs a macOS runner.
    runs-on: ${{ matrix.goos == 'darwin' && 'macos-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
          - target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
          - target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
          - target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
          - target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
          - target: aarch64-pc-windows-msvc
            goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        id: release
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8.0.2
        with:
          name: bro-extension-${{ steps.release.outputs.tag }}
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          exe=bro
          [[ "$GOOS" == windows ]] && exe=bro.exe
          mkdir -p dist/extension
          go build -trimpath -ldflags="-s -w" -o "dist/$exe" ./cmd/bro
          # The install script and `bro setup` find the extension beside bro.
          unzip -q "bro-extension-${{ steps.release.outputs.tag }}.zip" -d dist/extension
          cp README.md LICENSE NOTICE dist/
      - name: Sign
        if: matrix.goos == 'darwin'
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: scripts/macos-sign.sh dist/bro
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          base="bro-${{ steps.release.outputs.tag }}-${{ matrix.target }}"
          if [[ "${{ matrix.goos }}" == windows ]]; then
            (cd dist && zip -qr "../$base.zip" bro.exe extension README.md LICENSE NOTICE)
          else
            tar -C dist -czf "$base.tar.gz" bro extension README.md LICENSE NOTICE
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bro-${{ steps.release.outputs.tag }}-${{ matrix.target }}
          path: bro-${{ steps.release.outputs.tag }}-${{ matrix.target }}.*

  extension:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        id: release
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check versions
        run: pnpm version:check
      - name: Build shared protocol
        run: pnpm --filter @bro/shared build
      - name: Build extension
        run: pnpm --filter @bro/extension build
      - name: Typecheck Pi extension
        run: pnpm --filter @xiaotianxt/pi-bro typecheck
      - name: Test Pi extension
        run: pnpm --filter @xiaotianxt/pi-bro test
      - name: Package extension
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          (cd extension/dist && zip -qr "../../bro-extension-$tag.zip" .)
          # The Chrome Web Store assigns the listing its own key and rejects
          # one in the upload; the unpacked build keeps it to pin its ID.
          mkdir store
          cp -R extension/dist/. store/
          node -e 'const f="store/manifest.json",fs=require("fs"),m=JSON.parse(fs.readFileSync(f));delete m.key;fs.writeFileSync(f,JSON.stringify(m,null,2)+"\n")'
          (cd store && zip -qr "../bro-extension-store-$tag.zip" .)
      - name: Package Pi extension
        run: |
          set -euo pipefail
          mkdir -p pi-extension-dist
          pnpm --filter @xiaotianxt/pi-bro pack --pack-destination "$GITHUB_WORKSPACE/pi-extension-dist"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bro-extension-${{ steps.release.outputs.tag }}
          path: bro-extension-${{ steps.release.outputs.tag }}.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bro-extension-store-${{ steps.release.outputs.tag }}
          path: bro-extension-store-${{ steps.release.outputs.tag }}.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bro-pi-extension-${{ steps.release.outputs.tag }}
          path: pi-extension-dist/*.tgz

  github-release:
    name: GitHub Release
    needs: [build, extension]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Checksums
        run: |
          set -euo pipefail
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.tgz' \) -exec mv {} . \;
          sha256sum -- *.tar.gz *.zip *.tgz > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            *.tar.gz
            *.zip
            *.tgz
            SHA256SUMS
          generate_release_notes: true
