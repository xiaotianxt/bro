name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l cmd internal e2e)"
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go tool staticcheck ./...
      - name: Unit tests and contracts
        run: go test -count=1 -race ./...

  cross-build:
    name: Cross build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Build every release target
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/bro
          done

  extension:
    name: Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check versions
        run: pnpm version:check
      - name: Build shared protocol
        run: pnpm --filter @bro/shared build
      - name: Typecheck extension
        run: pnpm --filter @bro/extension typecheck
      - name: Test extension
        run: pnpm --filter @bro/extension test
      - name: Build extension
        run: pnpm --filter @bro/extension build
      - name: Typecheck Pi extension
        run: pnpm --filter @xiaotianxt/pi-bro typecheck
      - name: Test Pi extension
        run: pnpm --filter @xiaotianxt/pi-bro test
