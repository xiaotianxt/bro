[package]
name = "bro"
version = "0.2.3"
edition = "2021"
description = "Rust-native MCP server for controlling a local browser through a minimal WebExtension bridge"
authors = ["Yupei Tian"]
license = "Apache-2.0"
repository = "https://github.com/xiaotianxt/bro"
readme = "README.md"
keywords = ["mcp", "browser", "automation", "chromium", "rust"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
rmcp = { version = "1.7", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml_edit = "0.25.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
